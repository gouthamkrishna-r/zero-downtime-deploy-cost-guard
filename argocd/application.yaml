apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zero-downtime-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gouthamkrishna-r/zero-downtime-deploy-cost-guard.git
    targetRevision: main
    path: helm/zero-downtime-app
    helm:
      releaseName: zero-downtime-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
